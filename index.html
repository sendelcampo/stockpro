<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockPro POS</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #2a3347;
      --s1: #32405a;
      --s2: #3a4d6a;
      --bd: #546480;
      --ac: #f5c518;
      --err: #f07272;
      --ok: #45d99a;
      --tx: #edf0fa;
      --mu: #a0b2d0;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--tx); min-height: 100vh; }
    
    #login-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .lbox {
      background: var(--s1);
      border: 1px solid var(--bd);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    
    .llogo {
      font-family: 'Syne', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 10px;
    }
    
    .llogo span { color: var(--ac); }
    .lsub { color: var(--mu); font-size: 0.9rem; margin-bottom: 30px; }
    
    .ubtn {
      background: var(--s2);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 16px;
      color: var(--tx);
      cursor: pointer;
      margin-bottom: 10px;
      width: 100%;
      font-size: 1rem;
      transition: all 0.2s;
    }
    
    .ubtn:hover { background: var(--s1); border-color: var(--ac); }
    
    #pin-section { margin-top: 20px; border-top: 1px solid var(--bd); padding-top: 20px; }
    
    #pin-input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--bd);
      border-radius: 8px;
      background: var(--s2);
      color: var(--tx);
      font-size: 1.2rem;
      text-align: center;
      letter-spacing: 4px;
      margin-bottom: 10px;
    }
    
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }
    
    .btn.bg { background: var(--ac); color: #000; font-weight: 600; }
    .btn.bg:hover { background: #ffd700; }
    
    #pin-err { color: var(--err); font-size: 0.85rem; min-height: 18px; margin-bottom: 10px; }
    
    #app { display: none; }
    
    .menu { background: var(--s1); border-right: 1px solid var(--bd); padding: 20px; }
    .menu-btn { display: block; width: 100%; padding: 12px; background: var(--s2); border: none; color: var(--tx); cursor: pointer; border-radius: 6px; margin-bottom: 8px; text-align: left; }
    .menu-btn:hover { background: var(--s1); border: 1px solid var(--ac); }
    .menu-btn.active { background: var(--ac); color: #000; }
    
    .view { display: none; padding: 20px; }
    .view.active { display: block; }
    
    h1 { margin-bottom: 20px; }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="lbox">
    <div class="llogo">Stock<span>Pro</span> <span style="font-size: 0.9rem; color: var(--ac);">POS</span></div>
    <div class="lsub">Sistema de ventas e inventario</div>
    
    <div id="login-users"></div>
    
    <div id="pin-section">
      <div style="color: var(--mu); font-size: 0.85rem; margin-bottom: 10px;">O ingresá tu PIN</div>
      <input type="password" id="pin-input" placeholder="••••" maxlength="4">
      <div id="pin-err"></div>
      <button class="btn bg" onclick="loginPin()" style="width: 100%;">Entrar</button>
      <div style="color: var(--mu); font-size: 0.75rem; margin-top: 15px;">
        Admin: <strong>1234</strong> | Vendedor: <strong>0000</strong>
      </div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div style="display: flex; height: 100vh;">
    <div class="menu" style="width: 200px; overflow-y: auto;">
      <button class="menu-btn active" onclick="showView('dashboard')">📊 Dashboard</button>
      <button class="menu-btn" onclick="showView('pos')">🛒 Punto de Venta</button>
      <button class="menu-btn" onclick="showView('productos')">📦 Productos</button>
      <button class="menu-btn" onclick="showView('proveedores')">🏭 Proveedores</button>
      <button class="menu-btn" onclick="showView('egresos')">💸 Egresos</button>
      <button class="menu-btn" onclick="logout()" style="margin-top: 30px; background: var(--err);">🚪 Salir</button>
    </div>
    
    <div style="flex: 1; overflow-y: auto;">
      <div class="view active" id="view-dashboard">
        <h1>📊 Dashboard</h1>
        <p>Bienvenido a StockPro POS</p>
      </div>
      
      <div class="view" id="view-pos">
        <h1>🛒 Punto de Venta</h1>
        <p>Módulo en desarrollo...</p>
      </div>
      
      <div class="view" id="view-productos">
        <h1>📦 Productos</h1>
        <p>Módulo en desarrollo...</p>
      </div>
      
      <div class="view" id="view-proveedores">
        <h1>🏭 Proveedores</h1>
        <p>Módulo en desarrollo...</p>
      </div>
      
      <div class="view" id="view-egresos">
        <h1>💸 Egresos</h1>
        <p>Módulo en desarrollo...</p>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
// VARIABLES GLOBALES (sin duplicados)
// ═══════════════════════════════════════════════════════════════════════════════

let users = [
  { id: 'u1', name: 'Administrador', role: 'admin', pin: '1234', avatar: '👨‍💼' },
  { id: 'u2', name: 'Vendedor', role: 'vendedor', pin: '0000', avatar: '🧑‍💼' }
];

let currentUser = null;

// ═══════════════════════════════════════════════════════════════════════════════
// FUNCIONES DE LOGIN
// ═══════════════════════════════════════════════════════════════════════════════

function $i(id) {
  return document.getElementById(id);
}

function renderLoginUsers() {
  const html = users.map(u => 
    `<button class="ubtn" onclick="loginAs('${u.id}')">
      <div style="font-size: 2rem; margin-bottom: 8px;">${u.avatar}</div>
      <div style="font-weight: 600; margin-bottom: 4px;">${u.name}</div>
      <div style="font-size: 0.85rem; color: var(--mu);">${u.role}</div>
    </button>`
  ).join('');
  
  $i('login-users').innerHTML = html;
}

function loginAs(userId) {
  const user = users.find(u => u.id === userId);
  if (user) {
    currentUser = user;
    startApp();
  }
}

function loginPin() {
  const pin = $i('pin-input').value.trim();
  const errDiv = $i('pin-err');
  
  if (!pin) {
    errDiv.textContent = 'Ingresá tu PIN';
    return;
  }
  
  const user = users.find(u => String(u.pin) === String(pin));
  
  if (user) {
    currentUser = user;
    errDiv.textContent = '';
    startApp();
  } else {
    errDiv.textContent = 'PIN incorrecto. Probá 1234 o 0000';
  }
}

function startApp() {
  $i('login-screen').style.display = 'none';
  $i('app').style.display = 'block';
}

function logout() {
  currentUser = null;
  $i('login-screen').style.display = 'flex';
  $i('app').style.display = 'none';
  $i('pin-input').value = '';
  renderLoginUsers();
}

function showView(viewName) {
  // Ocultar todas las vistas
  document.querySelectorAll('.view').forEach(view => {
    view.classList.remove('active');
  });
  
  // Remover clase active de botones
  document.querySelectorAll('.menu-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  
  // Mostrar vista seleccionada
  const view = $i(`view-${viewName}`);
  if (view) {
    view.classList.add('active');
  }
  
  // Marcar botón como activo
  event.target.classList.add('active');
}

// ═══════════════════════════════════════════════════════════════════════════════
// INICIALIZACIÓN
// ═══════════════════════════════════════════════════════════════════════════════

document.addEventListener('DOMContentLoaded', () => {
  renderLoginUsers();
});
</script>

</body>
</html>
